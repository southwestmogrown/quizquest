# Render Blueprint — deploys all three QuizQuest services together

databases:
  - name: quizquest-db
    databaseName: quizquest
    user: quizquest

services:
  - type: web
    name: quizquest
    runtime: node
    region: oregon
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quizquest-db
          property: connectionString
      - key: CODE_RUNNER_URL
        fromService:
          name: quizquest-runner-internal
          type: pserv
          property: hostport
      - key: NODE_ENV
        value: production

  - type: pserv
    name: quizquest-runner-internal
    runtime: docker
    region: oregon
    dockerfilePath: ./runner/Dockerfile
    dockerContext: ./runner
