# Render Blueprint — deploys all three QuizQuest services together

databases:
  - name: quizquest-db
    plan: free
    databaseName: quizquest
    user: quizquest

services:
  - type: web
    name: quizquest
    env: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quizquest-db
          property: connectionString
      - key: CODE_RUNNER_URL
        fromService:
          name: quizquest-runner
          type: web
          property: url
      - key: NODE_ENV
        value: production

  - type: web
    name: quizquest-runner
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./runner/Dockerfile
    dockerContext: ./runner
